name: 每日文献邮件

on:
  schedule:
    # GitHub Actions使用UTC；00:37约等于北京时间08:37，避开整点高峰。
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anesthesia-literature-daily-content
  cancel-in-progress: false

jobs:
  generate-and-email:
    if: github.ref == 'refs/heads/main' && vars.EMAIL_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LITERATURE_MODE: production
      DEPLOY_ENV: email-production
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}
      AI_TEMPERATURE: ${{ vars.AI_TEMPERATURE || '0.1' }}
      AI_MAX_TOKENS: "7000"
      AI_TIMEOUT: ${{ vars.AI_TIMEOUT || '90000' }}
      AI_RETRY_COUNT: ${{ vars.AI_RETRY_COUNT || '1' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_TOOL: anesthesia_literature_daily
      CROSSREF_MAILTO: ${{ vars.NCBI_EMAIL }}
      DAILY_ARTICLE_COUNT: ${{ vars.DAILY_ARTICLE_COUNT || '5' }}
      DAILY_MAX_CANDIDATES: ${{ vars.DAILY_MAX_CANDIDATES || '2000' }}
      DAILY_CANDIDATE_PAGE_SIZE: ${{ vars.DAILY_CANDIDATE_PAGE_SIZE || '200' }}
      DAILY_JOURNAL_AUDIT_LIMIT: ${{ vars.DAILY_JOURNAL_AUDIT_LIMIT || '300' }}
      PUBMED_FETCH_BATCH_SIZE: ${{ vars.PUBMED_FETCH_BATCH_SIZE || '150' }}
      DAILY_AI_CALL_LIMIT: ${{ vars.DAILY_AI_CALL_LIMIT || '50' }}
      DAILY_TOKEN_LIMIT: ${{ vars.DAILY_TOKEN_LIMIT || '500000' }}
      DAILY_MAX_INPUT_CHARS: ${{ vars.DAILY_MAX_INPUT_CHARS || '60000' }}
      EMAIL_PROVIDER: buttondown
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BUTTONDOWN_API_BASE_URL: https://api.buttondown.com/v1
      BUTTONDOWN_RETRY_COUNT: "3"
      BUTTONDOWN_SUBSCRIBER_LIMIT: ${{ vars.BUTTONDOWN_SUBSCRIBER_LIMIT }}
      NEXT_PUBLIC_BUTTONDOWN_USERNAME: ${{ vars.NEXT_PUBLIC_BUTTONDOWN_USERNAME }}
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 使用标准Node运行器
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --ignore-scripts

      - name: 校验邮件任务配置
        run: node scripts/check-email-production-env.mjs

      - name: 运行文献和邮件测试
        run: npm run test:literature && npm run test:email

      - name: 生成今日真实简报
        run: npm run literature:daily

      - name: 更新历史简报、RSS和公开摘要
        run: npm run publication:prepare

      - name: 构建EdgeOne静态站点
        run: npm run build:edgeone

      - name: 检查公开数据和链接
        run: npm run test:deployment

      - name: 扫描公开文件和源码中的敏感信息
        run: npm run security:scan

      # 先把已验证期次持久化，再调用邮件服务。若投递失败，下一次
      # 运行会复用同一期内容，不会重新选文或重复消耗AI Token。
      - name: 保存并推送已验证期次
        run: |
          git config user.name "anesthesia-literature-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated data/state data/usage public/data public/rss.xml
          git add -f data/logs/latest-public-summary.json
          if git diff --cached --quiet; then
            echo "同一天已生成，不需要重复提交内容。"
            exit 0
          fi
          git commit -m "content: publish daily anesthesia briefing"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "第 ${attempt} 次推送失败，重新同步 main 后重试。"
            git fetch origin main
            git rebase origin/main
          done
          echo "无法把已验证期次安全推送到 main；停止邮件投递。"
          exit 1

      - name: 通过Buttondown发送
        run: npm run email:send-daily

      - name: 写入任务摘要
        if: always()
        run: node scripts/write-email-actions-summary.mjs

      - name: 保存投递状态
        if: always()
        run: |
          git config user.name "anesthesia-literature-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/logs/latest-email-summary.json
          if git diff --cached --quiet; then
            echo "投递状态没有变化。"
            exit 0
          fi
          git commit -m "email: record daily briefing delivery status"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "第 ${attempt} 次推送失败，重新同步 main 后重试。"
            git fetch origin main
            git rebase origin/main
          done
          exit 1
