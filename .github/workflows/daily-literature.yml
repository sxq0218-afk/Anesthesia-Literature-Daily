name: 每日文献自动更新

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anesthesia-literature-daily-content
  cancel-in-progress: false

jobs:
  generate-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LITERATURE_MODE: production
      DEPLOY_ENV: production
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}
      AI_TEMPERATURE: ${{ vars.AI_TEMPERATURE || '0.1' }}
      AI_MAX_TOKENS: "7000"
      AI_TIMEOUT: ${{ vars.AI_TIMEOUT || '90000' }}
      AI_RETRY_COUNT: ${{ vars.AI_RETRY_COUNT || '1' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_TOOL: anesthesia_literature_daily
      CROSSREF_MAILTO: ${{ vars.NCBI_EMAIL }}
      DAILY_ARTICLE_COUNT: ${{ vars.DAILY_ARTICLE_COUNT || '5' }}
      DAILY_MAX_CANDIDATES: ${{ vars.DAILY_MAX_CANDIDATES || '2000' }}
      DAILY_CANDIDATE_PAGE_SIZE: ${{ vars.DAILY_CANDIDATE_PAGE_SIZE || '200' }}
      DAILY_JOURNAL_AUDIT_LIMIT: ${{ vars.DAILY_JOURNAL_AUDIT_LIMIT || '300' }}
      PUBMED_FETCH_BATCH_SIZE: ${{ vars.PUBMED_FETCH_BATCH_SIZE || '150' }}
      DAILY_AI_CALL_LIMIT: ${{ vars.DAILY_AI_CALL_LIMIT || '50' }}
      DAILY_TOKEN_LIMIT: ${{ vars.DAILY_TOKEN_LIMIT || '500000' }}
      DAILY_MAX_INPUT_CHARS: ${{ vars.DAILY_MAX_INPUT_CHARS || '60000' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
      NEXT_TELEMETRY_DISABLED: "1"
      EMAIL_DELIVERY_ENABLED: ${{ vars.EMAIL_DELIVERY_ENABLED }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BUTTONDOWN_API_BASE_URL: https://api.buttondown.com/v1
      BUTTONDOWN_RETRY_COUNT: "3"
      BUTTONDOWN_SUBSCRIBER_LIMIT: ${{ vars.BUTTONDOWN_SUBSCRIBER_LIMIT }}
      NEXT_PUBLIC_BUTTONDOWN_USERNAME: ${{ vars.NEXT_PUBLIC_BUTTONDOWN_USERNAME }}
      NEXT_PUBLIC_SUBSCRIPTION_EMAIL: ${{ vars.NEXT_PUBLIC_SUBSCRIPTION_EMAIL }}
      SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
      SUBSCRIPTION_INBOX_IMAP_HOST: ${{ vars.SUBSCRIPTION_INBOX_IMAP_HOST }}
      SUBSCRIPTION_INBOX_IMAP_PORT: ${{ vars.SUBSCRIPTION_INBOX_IMAP_PORT }}
      SUBSCRIPTION_INBOX_USER: ${{ secrets.SUBSCRIPTION_INBOX_USER }}
      SUBSCRIPTION_INBOX_PASSWORD: ${{ secrets.SUBSCRIPTION_INBOX_PASSWORD }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      TENCENT_SES_REGION: ${{ vars.TENCENT_SES_REGION }}
      TENCENT_SES_FROM_EMAIL: ${{ vars.TENCENT_SES_FROM_EMAIL }}
      TENCENT_SES_REPLY_TO: ${{ vars.TENCENT_SES_REPLY_TO }}
      TENCENT_SES_DAILY_TEMPLATE_ID: ${{ vars.TENCENT_SES_DAILY_TEMPLATE_ID }}
      TENCENT_SES_NOTICE_TEMPLATE_ID: ${{ vars.TENCENT_SES_NOTICE_TEMPLATE_ID }}
      EMAIL_DAILY_SEND_LIMIT: ${{ vars.EMAIL_DAILY_SEND_LIMIT }}
      EMAIL_SEND_DELAY_MS: ${{ vars.EMAIL_SEND_DELAY_MS }}
      EMAIL_MONTHLY_COST_LIMIT_CNY: ${{ vars.EMAIL_MONTHLY_COST_LIMIT_CNY }}

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 使用标准Node运行器
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --ignore-scripts

      - name: 校验必要配置
        run: node scripts/check-production-env.mjs

      - name: 运行核心测试
        run: npm run test:literature && npm run test:email

      - name: 生成今日真实简报
        run: npm run literature:daily

      - name: 更新历史简报、RSS和公开摘要
        run: npm run publication:prepare

      - name: 构建EdgeOne静态站点
        run: npm run build:edgeone

      - name: 检查公开数据和链接
        run: npm run test:deployment

      - name: 扫描密钥、源码和境外公共CDN依赖
        run: npm run security:scan

      - name: 处理订阅确认和退订邮件
        if: env.EMAIL_DELIVERY_ENABLED == 'true' && env.EMAIL_PROVIDER == 'tencent-ses'
        run: npm run email:process

      - name: 向已确认订阅者发送今日简报
        if: env.EMAIL_DELIVERY_ENABLED == 'true'
        run: npm run email:send-daily

      - name: 写入安全任务摘要
        if: always()
        run: node scripts/write-actions-summary.mjs

      - name: 提交正式发布结果
        run: |
          git config user.name "anesthesia-literature-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated data/state data/usage data/email public/data public/rss.xml
          git add -f data/logs/latest-public-summary.json data/logs/latest-email-summary.json          
          if git diff --cached --quiet; then
            echo "同一天已发布或没有可提交的新内容。"
            exit 0
          fi
          git commit -m "content: publish daily anesthesia briefing"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "第 ${attempt} 次推送失败，重新同步 main 后重试。"
            git fetch origin main
            git rebase origin/main
          done
          exit 1
