name: 测试 AI 连接

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-ai.yml

permissions:
  contents: read

concurrency:
  group: anesthesia-literature-ai-connection-test
  cancel-in-progress: true

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}
      AI_TEMPERATURE: ${{ vars.AI_TEMPERATURE || '0.1' }}
      AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '5000' }}
      AI_TIMEOUT: ${{ vars.AI_TIMEOUT || '90000' }}
      AI_RETRY_COUNT: ${{ vars.AI_RETRY_COUNT || '1' }}
      DAILY_AI_CALL_LIMIT: ${{ vars.DAILY_AI_CALL_LIMIT || '30' }}
      DAILY_TOKEN_LIMIT: ${{ vars.DAILY_TOKEN_LIMIT || '500000' }}
      DAILY_MAX_INPUT_CHARS: ${{ vars.DAILY_MAX_INPUT_CHARS || '60000' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4

      - name: 使用标准 Node 运行器
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm

      - name: 安装锁定依赖
        run: npm ci --ignore-scripts

      - name: 执行真实低 Token 连接测试
        run: |
          node --input-type=module <<'NODE'
          import { testAIConnection } from "./src/llm/index.mjs";
          const result = await testAIConnection({ rootDir: process.cwd() });
          const safe = {
            success: result.success,
            provider: result.provider,
            model: result.model,
            latencyMs: result.latencyMs,
            usage: result.usage,
          };
          console.log(JSON.stringify(safe));
          if (!result.success) process.exit(1);
          NODE

      - name: 写入安全任务摘要
        if: always()
        run: |
          echo "### AI连接测试" >> "$GITHUB_STEP_SUMMARY"
          echo "已执行真实低Token调用；日志与摘要不会输出API Key。" >> "$GITHUB_STEP_SUMMARY"
